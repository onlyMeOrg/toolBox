<!doctype html><meta charset="utf-8"><pre id="log"></pre>
<script type="module">
// Proves every reference solution of the measuring set with the real toolchain: tests pass, pixels match.
import { TASKS } from './tasks.mjs';
import { TASKS2 } from './tasks2.mjs';
import { RECIPES } from './recipes.mjs';
import { SEEDS } from './data/seeds.mjs';
const R = window.R = { rows: [] };
const k = new Worker('/agente/build-worker.js', { type: 'module' });
let job = 0; const waiting = new Map();
const kready = new Promise((ok, bad) => { k.onmessage = (e) => { const m = e.data;
  if (m.type === 'ready') ok(); else if (m.type === 'error' && m.id === undefined) bad(new Error(m.text));
  else if (waiting.has(m.id)) { const w = waiting.get(m.id);
    if (m.type === 'output') w.out += m.text; else if (m.type === 'diagnostics') w.diags = m.items;
    else if (m.type === 'error') { waiting.delete(m.id); w.ok({ code: -1, out: w.out + m.text }); }
    else if (m.type === 'done') { if (m.stage === 'compile') { w.compile = m; if (!m.runs) { waiting.delete(m.id); w.ok({ code: m.code, out: w.out, bytes: m.bytes, memory: m.memory, ms: m.ms }); } }
      else { waiting.delete(m.id); w.ok({ code: w.compile.code, out: w.out, run: m.code, ms: w.compile.ms }); } } } }; });
const tc = await (await fetch('/agente/toolchain/current.json')).json();
k.postMessage({ type: 'load', base: new URL(`/agente/toolchain/${tc.tag}/`, location.href).href });
const compile = (type, source) => new Promise((ok) => { const id = ++job; waiting.set(id, { ok, out: '' }); k.postMessage({ type, id, source }); });
const RUN = `onmessage = async (e) => { const { bytes, memory: lim, w, h, times } = e.data; try {
  const module = await WebAssembly.compile(bytes); const memory = new WebAssembly.Memory({ initial: lim.initial, maximum: Math.min(lim.maximum ?? 4096, 4096), shared: true });
  const dv = () => new DataView(memory.buffer); const wasi = { fd_write(fd, iovs, n, nw) { let t = 0; for (let i = 0; i < n; i++) t += dv().getUint32(iovs + i * 8 + 4, true); dv().setUint32(nw, t, true); return 0; },
    environ_sizes_get(a, b) { dv().setUint32(a, 0, true); dv().setUint32(b, 0, true); return 0; }, environ_get() { return 0; }, clock_time_get(i, p, ptr) { dv().setBigUint64(ptr, 0n, true); return 0; }, sched_yield() { return 0; }, proc_exit(c) { throw new Error('exit ' + c); } };
  const imports = {}; for (const im of WebAssembly.Module.imports(module)) { imports[im.module] ??= {}; imports[im.module][im.name] = im.kind === 'memory' ? memory : (wasi[im.name] || (() => 52)); }
  const x = (await WebAssembly.instantiate(module, imports)).exports; if (!x.init || !x.frame) throw new Error('missing export');
  x._initialize?.(); x.init(w, h); let ptr = 0; for (const t of times) ptr = x.frame(t) >>> 0;
  postMessage({ px: new Uint8Array(memory.buffer, ptr, w * h * 4).slice() }); } catch (err) { postMessage({ error: String(err.message || err) }); } };`;
const runTile = (b, times = [0, 16, 33]) => new Promise((ok) => { const w = new Worker(URL.createObjectURL(new Blob([RUN], { type: 'text/javascript' }))); const t = setTimeout(() => { w.terminate(); ok({ error: 'timeout' }); }, 3000);
  w.onmessage = (e) => { clearTimeout(t); w.terminate(); ok(e.data); }; w.postMessage({ bytes: b.bytes, memory: b.memory, w: 64, h: 48, times }); });
await kready;
const MEASURED = [...TASKS, ...TASKS2], TILES = MEASURED.filter((t) => t.kind === 'tile');
// A program that is not of the measuring set must not draw one of its pictures: run it against every tile check.
const leaks = async (built) => { const hit = []; for (const t of TILES) { const p = await runTile(built, t.times); if (!p.error && t.check(p.px, 64, 48)) hit.push(t.id); } return hit; };
for (const task of MEASURED) {
  let ok = false, why = '';
  if (task.kind === 'fn') { const r = await compile('test', task.solution + `\n#[cfg(test)]\nmod hidden_tests {\n    use super::*;\n    #[test]\n    fn hidden() { ${task.tests} }\n}\n`); ok = r.code === 0 && r.run === 0; why = ok ? '' : r.out.slice(0, 600); }
  else { const r = await compile('build', task.solution); if (r.code !== 0) why = r.out.slice(0, 600); else { const t = await runTile(r, task.times); ok = !t.error && task.check(t.px, 64, 48); why = t.error || (ok ? '' : 'wrong picture'); } }
  R.rows.push({ id: task.id, ok, why }); console.log(task.id, ok ? 'ok' : 'FAIL ' + why);
}
for (const r of RECIPES) {
  let ok = false, why = '';
  if (r.kind === 'fn') { const b = await compile('test', r.code + `\n#[cfg(test)]\nmod hidden_tests {\n    use super::*;\n    #[test]\n    fn hidden() { ${r.tests} }\n}\n`); ok = b.code === 0 && b.run === 0; why = ok ? '' : b.out.slice(0, 600);
    const same = MEASURED.filter((t) => t.kind === 'fn' && [...r.code.matchAll(/pub fn ([a-z_0-9]+)/g)].some((m) => t.solution.includes(`pub fn ${m[1]}(`))).map((t) => t.id); if (same.length) { ok = false; why = 'same function as a measuring task: ' + same; } }
  else { const b = await compile('build', r.code); if (b.code !== 0) why = b.out.slice(0, 600); else { const t = await runTile(b, r.times); ok = !t.error && r.check(t.px, 64, 48); why = t.error || (ok ? '' : 'wrong picture');
    const hit = ok ? await leaks(b) : []; if (hit.length) { ok = false; why = 'draws a picture of the measuring set: ' + hit; } } }
  R.rows.push({ id: r.id, ok, why }); console.log(r.id, ok ? 'ok' : 'FAIL ' + why);
}
// Tile seeds of the training data against the checks of the measuring sets.
if (new URLSearchParams(location.search).has('seeds')) for (const s of SEEDS.filter((s) => s.kind === 'tile')) {
  const b = await compile('build', s.code); const hit = b.code === 0 ? await leaks(b) : [];
  R.rows.push({ id: 'seed ' + s.id, ok: hit.length === 0, why: hit.length ? 'draws a picture of the measuring set: ' + hit : '' }); console.log(s.id, hit.length ? 'FAIL ' + hit : 'ok');
}
R.done = true;
</script>
